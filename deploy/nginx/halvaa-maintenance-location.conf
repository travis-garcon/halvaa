# Internal response used only by Halvaa locations protected by the maintenance
# guard. It deliberately contains no reason related to billing.
location @halvaa_maintenance {
    internal;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Retry-After "3600" always;
    return 503 '<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Halvaa — Temporarily unavailable</title><style>html{color-scheme:light}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#faf8f5;color:#24211f;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(560px,100%);padding:40px 32px;text-align:center;background:#fff;border:1px solid #e8e0d8;border-radius:18px;box-shadow:0 16px 50px rgba(52,42,34,.08)}h1{margin:0 0 12px;font-size:clamp(1.7rem,5vw,2.4rem)}p{margin:8px 0;color:#6b625c;line-height:1.7}.fa{direction:rtl}</style></head><body><main class="card"><h1>Temporarily unavailable</h1><p>Halvaa is temporarily unavailable. Please check back later.</p><p class="fa" lang="fa">حلوا موقتاً در دسترس نیست. لطفاً بعداً دوباره مراجعه کنید.</p></main></body></html>';
}
