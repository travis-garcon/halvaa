# Halvaa-only maintenance guard.
#
# Nginx evaluates the file check for every request, so changing the flag does
# not require an Nginx reload. Include this snippet only in Halvaa-owned
# locations; shared project locations must remain unguarded.
if (-f /etc/nginx/halvaa-maintenance.enabled) {
    return 418;
}

# Use an internal status so genuine upstream 503 responses are not rewritten.
error_page 418 = @halvaa_maintenance;
