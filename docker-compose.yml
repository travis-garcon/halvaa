  #     ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
  #     ZITADEL_DATABASE_POSTGRES_USER: halvaa
  #     ZITADEL_DATABASE_POSTGRES_PASSWORD: halvaa
