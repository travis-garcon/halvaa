services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: halvaa
      POSTGRES_PASSWORD: halvaa
      POSTGRES_DB: halvaa
    ports:
      - "5432:5432"
    volumes:
      - halvaa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U halvaa -d halvaa"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - halvaa_redis:/data

  local-map:
    image: nginx:1.27-alpine
    ports:
      - "8081:80"
    volumes:
      - ./map-data:/usr/share/nginx/html:ro
      - ./docker/local-map-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health.txt"]
      interval: 5s
      timeout: 5s
      retries: 10

  # zitadel:
  #   image: ghcr.io/zitadel/zitadel:latest
